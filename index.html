<script>
  // ============================================================
  // CONFIGURAZIONE FIREBASE — sostituisci con i valori del TUO
  // nuovo progetto Firebase (Project settings > General > la tua
  // web app > Config). Sono valori pubblici lato client: la
  // sicurezza vera è nelle regole di Firestore, non nel nasconderli.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyA3rNXyOkGKvDeW5m96S5Ed7r-3kJ3n2e4",
    authDomain: "trip-plaaner-eac5c.firebaseapp.com",
    projectId: "trip-plaaner-eac5c",
    storageBucket: "trip-plaaner-eac5c.firebasestorage.app",
    messagingSenderId: "796133832787",
    appId: "1:796133832787:web:8cefc4fd4b59f48b9d6ea6"
  };

  window.__connDebug = { authError: null, authOk: false, initError: null };

  let auth, db;
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
  } catch (err) {
    window.__connDebug.initError = (err && err.code ? err.code + ": " : "") + (err && err.message ? err.message : String(err));
  }

  const DOC_REF = () => db.collection("tripplanner").doc("main");

  // Storage adapter con la stessa interfaccia usata nell'artifact
  // (get/set su una singola chiave), ma sostenuta da Firestore.
  window.storage = {
    async get(key) {
      const snap = await DOC_REF().get();
      if (!snap.exists) return null;
      const data = snap.data();
      if (!(key in data)) return null;
      return { key, value: data[key], shared: false };
    },
    async set(key, value) {
      await DOC_REF().set({ [key]: value }, { merge: true });
      return { key, value, shared: false };
    },
  };

  // Test diretto via REST, senza passare dall'SDK Firebase: chiama l'endpoint
  // di sign-up anonimo di Identity Toolkit e registra lo stato HTTP grezzo.
  // Questo ci dice se il problema è nella rete/DNS (la fetch va in timeout)
  // o è una risposta del server (es. 400 con un messaggio di errore preciso).
  window.__connDebug.restTest = "in corso...";
  (function () {
    const url = "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + firebaseConfig.apiKey;
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 8000);
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ returnSecureToken: true }),
      signal: controller.signal,
    })
      .then(async (res) => {
        clearTimeout(t);
        const text = await res.text();
        window.__connDebug.restTest = "HTTP " + res.status + ": " + text.slice(0, 200);
      })
      .catch((err) => {
        clearTimeout(t);
        window.__connDebug.restTest = "FETCH FALLITA: " + (err && err.name ? err.name + " — " : "") + (err && err.message ? err.message : String(err));
      });
  })();

  window.__authReady = new Promise((resolve, reject) => {
    auth.onAuthStateChanged(
      (user) => {
        if (user) {
          window.__connDebug.authOk = true;
          window.__connDebug.uid = user.uid;
          window.__connDebug.isAnonymous = user.isAnonymous;
          user.getIdToken(true).then(
            (token) => {
              window.__connDebug.tokenOk = true;
              window.__connDebug.tokenLen = token ? token.length : 0;
              resolve(user);
            },
            (err) => {
              window.__connDebug.tokenOk = false;
              window.__connDebug.tokenError = (err && err.code ? err.code + ": " : "") + (err && err.message ? err.message : String(err));
              resolve(user); // proseguiamo comunque per vedere l'errore Firestore
            }
          );
        } else {
          auth.signInAnonymously().catch((err) => {
            window.__connDebug.authError = (err && err.code ? err.code + ": " : "") + (err && err.message ? err.message : String(err));
            reject(err);
          });
        }
      },
      (err) => {
        window.__connDebug.authError = (err && err.code ? err.code + ": " : "") + (err && err.message ? err.message : String(err));
        reject(err);
      }
    );
  });
</script>


<script type="text/babel-source" id="app-source">
const { useState, useEffect, useCallback } = React;

// Icone SVG incorporate (nessuna libreria esterna necessaria)
function Icon({ size = 16, style, children }) {

}
const Plane = (p) => <Icon {...p}><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2Z" /></Icon>;
const Bed = (p) => <Icon {...p}><path d="M2 4v16" /><path d="M2 8h18a2 2 0 0 1 2 2v10" /><path d="M2 17h20" /><path d="M6 8V6a2 2 0 0 1 2-2h3" /></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></Icon>;
const LinkIcon = (p) => <Icon {...p}><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1" /></Icon>;
const StickyNote = (p) => <Icon {...p}><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11l6-6V5a2 2 0 0 0-2-2Z" /><path d="M15 3v6h6" /></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /></Icon>;

const Wallet = (p) => <Icon {...p}><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5" /><path d="M21 12h-4a2 2 0 0 0 0 4h4" /></Icon>;
const Navigation = (p) => <Icon {...p}><polygon points="3 11 22 2 13 21 11 13 3 11" /></Icon>;
const Compass = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" /></Icon>;
const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const ArrowRightLeft = (p) => <Icon {...p}><path d="m16 3 4 4-4 4" /><path d="M20 7H4" /><path d="m8 21-4-4 4-4" /><path d="M4 17h16" /></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;

const STORAGE_KEY = "trip-planner-v2";

const emptyNightDraft = () => ({
  checkIn: "",
  nights: 1,
  hotel: "",
  location: "",
  confirmation: "",
  pin: "",
  paid: false,
  cancelInfo: "",
  link: "",
  address: "",
});

const emptyActivity = () => ({
  id: crypto.randomUUID(),
  type: "activity",
  date: "",
  time: "",
  title: "",
  notes: "",
  location: "",
  link: "",
});

const emptyTransport = () => ({
  id: crypto.randomUUID(),
  type: "transport",
  date: "",
  startTime: "",
  endTime: "",
  mode: "",
  from: "",
  to: "",
  notes: "",
  link: "",
});

const emptyFlight = () => ({ date: "", depTime: "", arrTime: "", from: "", to: "" });

const MONTHS_IT = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];

// Costruisce/manipola le date usando solo componenti locali (anno/mese/giorno),
// senza mai passare per toISOString/UTC, per evitare lo sfasamento di un giorno.
function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function toDateStr(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}
function addDays(dateStr, n) {
  const d = parseLocalDate(dateStr);
  d.setDate(d.getDate() + n);
  return toDateStr(d);
}

function fmtDate(d) {
  if (!d) return "—";
  const parts = d.split("-");
  if (parts.length !== 3) return d;
  const [, m, day] = parts;
  const w = parseLocalDate(d).toLocaleDateString("it-IT", { weekday: "short" });
  return `${day}/${m} · ${w}`;
}

// Per un pernottamento mostra l'intervallo notte, es. "20-21 dic" (o "31 dic - 1 gen" a cavallo di mese)
function fmtNightRange(dateStr) {
  if (!dateStr) return "—";
  const start = parseLocalDate(dateStr);
  const end = parseLocalDate(dateStr);
  end.setDate(end.getDate() + 1);
  const startDay = start.getDate();
  const endDay = end.getDate();
  if (start.getMonth() === end.getMonth()) {
    return `${startDay}-${endDay} ${MONTHS_IT[end.getMonth()]}`;
  }
  return `${startDay} ${MONTHS_IT[start.getMonth()]} - ${endDay} ${MONTHS_IT[end.getMonth()]}`;
}

function TripPlanner() {
  const [tripName, setTripName] = useState("Il mio viaggio");
  const [flightOut, setFlightOut] = useState(emptyFlight());
  const [flightIn, setFlightIn] = useState(emptyFlight());
  const [items, setItems] = useState([]); // mix di {type:'night',...} e {type:'activity',...}
  const [loaded, setLoaded] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [viewingId, setViewingId] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [editingFlight, setEditingFlight] = useState(null);
  const [nameEditing, setNameEditing] = useState(false);
  const [addMode, setAddMode] = useState(null); // 'night' | null
  const [nightDraft, setNightDraft] = useState(emptyNightDraft());
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const [deleteInput, setDeleteInput] = useState("");

  const defaultNewDate = flightOut.date ? addDays(flightOut.date, 1) : "";

  const [connError, setConnError] = useState(null);
  const [, forceDebugRefresh] = useState(0);

  useEffect(() => {
    let count = 0;
    const id = setInterval(() => {
      count++;
      forceDebugRefresh((n) => n + 1);
      if (count > 12) clearInterval(id);
    }, 800);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const timeout = new Promise((_, rej) =>
          setTimeout(() => rej(new Error("TIMEOUT: nessuna risposta dal server di autenticazione dopo 8 secondi. È probabile un blocco di rete (firewall, DNS a filtro, o un blocco della rete Wi-Fi/mobile) verso i domini Google di autenticazione.")), 8000)
        );
        await Promise.race([window.__authReady, timeout]);
        forceDebugRefresh((n) => n + 1);
      } catch (e) {
        setConnError((window.__connDebug.initError ? "Init: " + window.__connDebug.initError + " — " : "") + (window.__connDebug.authError || e.message || String(e)));
        setLoaded(true);
        return;
      }
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          setTripName(data.tripName ?? "Il mio viaggio");
          setFlightOut(data.flightOut ?? emptyFlight());
          setFlightIn(data.flightIn ?? emptyFlight());
          setItems(Array.isArray(data.items) ? data.items : []);
        }
      } catch (e) {
        setConnError("Errore di lettura da Firestore: " + (e.code ? e.code + " — " : "") + (e.message || String(e)));
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setSaveState("saving");
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      setSaveState("saved");
      setConnError(null);
      setTimeout(() => setSaveState("idle"), 1200);
    } catch (e) {
      setSaveState("idle");
      setConnError("Errore di scrittura su Firestore: " + (e.code ? e.code + " — " : "") + (e.message || String(e)));
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    persist({ tripName, flightOut, flightIn, items });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tripName, flightOut, flightIn, items, loaded]);

  function sortTime(item) {
    if (item.type === "night") return "99:99"; // il pernottamento chiude sempre la giornata
    return item.type === "transport" ? (item.startTime || "00:00") : (item.time || "00:00");
  }
  const sorted = [...items].sort((a, b) => {
    const c = (a.date || "9999").localeCompare(b.date || "9999");
    if (c !== 0) return c;
    return sortTime(a).localeCompare(sortTime(b));
  });

  function updateItem(id, patch) {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));
  }
  function removeItem(id) {
    setItems((prev) => prev.filter((it) => it.id !== id));
    setEditingId(null);
  }
  function commitNightDraft() {
    const d = nightDraft;
    if (!d.checkIn) return;
    const n = Math.max(1, Number(d.nights) || 1);
    const created = Array.from({ length: n }).map((_, i) => ({
      id: crypto.randomUUID(),
      type: "night",
      date: addDays(d.checkIn, i),
      hotel: d.hotel,
      location: d.location,
      confirmation: d.confirmation,
      pin: d.pin,
      paid: d.paid,
      cancelInfo: d.cancelInfo,
      link: d.link,
      address: d.address,
    }));
    setItems((prev) => [...prev, ...created]);
    setNightDraft(emptyNightDraft());
    setAddMode(null);
  }
  function addActivity() {
    const a = emptyActivity();
    a.date = defaultNewDate;
    setItems((prev) => [...prev, a]);
    setEditingId(a.id);
    setAddMode(null);
  }
  function addTransport() {
    const t = emptyTransport();
    t.date = defaultNewDate;
    setItems((prev) => [...prev, t]);
    setEditingId(t.id);
    setAddMode(null);
  }
  function openNightAddForm() {
    setNightDraft((d) => ({ ...d, checkIn: d.checkIn || defaultNewDate }));
    setAddMode("night");
  }
  function buildTripSummaryHTML() {
    const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const rows = sorted.map((item) => {
      if (item.type === "night") {
        return `
          <div class="entry entry-night">
            <div class="entry-date">${esc(fmtNightRange(item.date))}</div>
            <div class="entry-body">
              <div class="entry-title">🛏 ${esc(item.hotel || "Struttura")}</div>
              ${item.location ? `<div class="entry-sub">${esc(item.location)}</div>` : ""}
              <table class="meta">
                ${item.confirmation ? `<tr><td>Conferma</td><td>${esc(item.confirmation)}</td></tr>` : ""}
                ${item.pin ? `<tr><td>PIN</td><td>${esc(item.pin)}</td></tr>` : ""}
                <tr><td>Pagato</td><td>${item.paid ? "Sì" : "No"}</td></tr>
                ${item.cancelInfo ? `<tr><td>Cancellazione</td><td>${esc(item.cancelInfo)}</td></tr>` : ""}
                ${item.address ? `<tr><td>Indirizzo</td><td>${esc(item.address)}</td></tr>` : ""}
                ${item.link ? `<tr><td>Link</td><td>${esc(item.link)}</td></tr>` : ""}
              </table>
            </div>
          </div>`;
      }
      if (item.type === "transport") {
        const time = [item.startTime, item.endTime].filter(Boolean).join(" – ");
        return `
          <div class="entry entry-transport">
            <div class="entry-date">${esc(fmtDate(item.date))}${time ? ` · ${esc(time)}` : ""}</div>
            <div class="entry-body">
              <div class="entry-title">↔ ${esc(item.mode || "Spostamento")}${(item.from || item.to) ? ` · ${esc(item.from || "?")} → ${esc(item.to || "?")}` : ""}</div>
              ${item.notes ? `<div class="entry-notes">${esc(item.notes)}</div>` : ""}
              ${item.link ? `<div class="entry-sub">${esc(item.link)}</div>` : ""}
            </div>
          </div>`;
      }
      return `
        <div class="entry entry-activity">
          <div class="entry-date">${esc(fmtDate(item.date))}${item.time ? ` · ${esc(item.time)}` : ""}</div>
          <div class="entry-body">
            <div class="entry-title">◈ ${esc(item.title || "Attività")}</div>
            ${item.location ? `<div class="entry-sub">${esc(item.location)}</div>` : ""}
            ${item.notes ? `<div class="entry-notes">${esc(item.notes)}</div>` : ""}
            ${item.link ? `<div class="entry-sub">${esc(item.link)}</div>` : ""}
          </div>
        </div>`;
    }).join("");

    const flightBlock = (label, f) => `
      <div class="flight">
        <strong>${label}</strong> —
        ${f.date ? esc(fmtDate(f.date)) : "data da definire"}
        ${f.from && f.to ? ` · ${esc(f.from)} → ${esc(f.to)}` : ""}
        ${f.depTime ? ` · Partenza ${esc(f.depTime)}` : ""}
        ${f.arrTime ? ` · Arrivo ${esc(f.arrTime)}` : ""}
      </div>`;

    return `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8" />
      <title>${esc(tripName)}</title>
      <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1C2128; padding: 24px; max-width: 720px; margin: 0 auto; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        .flight { font-size: 12.5px; background: #1C2128; color: #fff; padding: 8px 12px; border-radius: 8px; margin: 6px 0; }
        .entry { display: flex; gap: 10px; margin: 10px 0; padding-bottom: 10px; border-bottom: 1px solid #eee; page-break-inside: avoid; }
        .entry-date { width: 110px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #3D5A6C; font-family: monospace; }
        .entry-title { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
        .entry-sub { font-size: 12px; color: #555; }
        .entry-notes { font-size: 12px; color: #5A4632; background: #FBEEDB; padding: 6px 8px; border-radius: 6px; margin-top: 4px; white-space: pre-wrap; }
        table.meta { font-size: 11.5px; margin-top: 4px; border-collapse: collapse; }
        table.meta td { padding: 1px 8px 1px 0; color: #444; }
        table.meta td:first-child { color: #888; }
        @media print { body { padding: 0; } }
      </style></head><body>
      <h1>${esc(tripName)}</h1>
      ${flightBlock("Volo andata", flightOut)}
      ${rows}
      ${flightBlock("Volo ritorno", flightIn)}
      </body></html>`;
  }

  function exportPdf() {
    const html = buildTripSummaryHTML();
    const w = window.open("", "_blank");
    if (!w) {
      alert("Abilita i pop-up per esportare il PDF, poi riprova.");
      return false;
    }
    w.document.write(html);
    w.document.close();
    setTimeout(() => w.print(), 350);
    return true;
  }

  function startDeleteFlow() {
    exportPdf();
    setDeleteInput("");
    setConfirmingDelete(true);
  }
  function cancelDeleteFlow() {
    setConfirmingDelete(false);
    setDeleteInput("");
  }
  function confirmDelete() {
    if (deleteInput.trim().toUpperCase() !== "ELIMINA") return;
    setTripName("Il mio viaggio");
    setFlightOut(emptyFlight());
    setFlightIn(emptyFlight());
    setItems([]);
    setConfirmingDelete(false);
    setDeleteInput("");
  }

  return (
    <div style={styles.page}>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
      <div style={styles.wrap}>
        {connError && (
          <div style={styles.errorBanner}>
            ⚠ {connError}
          </div>
        )}
        <header style={styles.header}>
          <div style={styles.eyebrow}>DIARIO DI VIAGGIO</div>
          {nameEditing ? (
            <input
              autoFocus
              value={tripName}
              onChange={(e) => setTripName(e.target.value)}
              onBlur={() => setNameEditing(false)}
              onKeyDown={(e) => e.key === "Enter" && setNameEditing(false)}
              style={styles.titleInput}
            />
          ) : (
            <h1 style={styles.title} onClick={() => setNameEditing(true)}>
              {tripName}
              <Pencil size={16} style={{ marginLeft: 10, opacity: 0.35 }} />
            </h1>
          )}
          <div style={styles.saveIndicator}>

            <div style={styles.emptyState}>

            </div>

            item.type === "night" ? (
              <NightRow
                key={item.id}
                item={item}
                editing={editingId === item.id}
                onEdit={() => setEditingId(editingId === item.id ? null : item.id)}
                onView={() => setViewingId(item.id)}
                onChange={(p) => updateItem(item.id, p)}
                onDelete={() => removeItem(item.id)}
              />
            ) : item.type === "transport" ? (
              <TransportRow
                key={item.id}
                item={item}
                editing={editingId === item.id}
                onEdit={() => setEditingId(editingId === item.id ? null : item.id)}
                onView={() => setViewingId(item.id)}
                onChange={(p) => updateItem(item.id, p)}
                onDelete={() => removeItem(item.id)}
              />
            ) : (
              <ActivityRow
                key={item.id}
                item={item}
                editing={editingId === item.id}
                onEdit={() => setEditingId(editingId === item.id ? null : item.id)}
                onView={() => setViewingId(item.id)}
                onChange={(p) => updateItem(item.id, p)}
                onDelete={() => removeItem(item.id)}
              />
            )
          )}

          <div style={styles.stopRow}>

            </div>

                <div style={styles.addButtonsRow}>
                  <button style={styles.addStopBtn} onClick={openNightAddForm}>
                    <Bed size={15} /> Pernottamento
                  </button>
                  <button style={styles.addStopBtn} onClick={addActivity}>
                    <Compass size={15} /> Attività
                  </button>
                  <button style={styles.addStopBtn} onClick={addTransport}>
                    <ArrowRightLeft size={15} /> Spostamento
                  </button>
                </div>
              )}
              {addMode === "night" && (
                <div style={styles.card}>
                  <div style={styles.cardTopLeft}>
                    <Bed size={15} style={{ opacity: 0.55 }} />
                    <span style={styles.cardHotel}>Nuovo pernottamento</span>
                  </div>
                  <NightForm draft={nightDraft} onChange={(p) => setNightDraft((d) => ({ ...d, ...p }))} />
                  <div style={styles.formActions}>
                    <button style={styles.deleteBtn} onClick={() => { setAddMode(null); setNightDraft(emptyNightDraft()); }}>
                      Annulla
                    </button>
                    <button style={styles.doneBtn} onClick={commitNightDraft}>
                      <Check size={13} /> Aggiungi {Math.max(1, Number(nightDraft.nights) || 1)} nott{Math.max(1, Number(nightDraft.nights) || 1) === 1 ? "e" : "i"}
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

        <FlightCard
          label="VOLO RITORNO"
          icon={<Plane size={18} style={{ transform: "rotate(225deg)" }} />}
          flight={flightIn}
          editing={editingFlight === "in"}
          onEdit={() => setEditingFlight("in")}
          onDone={() => setEditingFlight(null)}
          onChange={(patch) => setFlightIn((f) => ({ ...f, ...patch }))}
        />

        <div style={styles.footer}>Dati salvati automaticamente sul dispositivo</div>
        <div style={styles.debugLine}>
          debug — uid: {window.__connDebug?.uid || "nessuno"} · anon: {String(window.__connDebug?.isAnonymous)} · token: {window.__connDebug?.tokenOk === true ? "ok" : (window.__connDebug?.tokenError || "n/d")}
          <br />rest: {window.__connDebug?.restTest || "n/d"}
        </div>

        <button style={styles.exportBtn} onClick={exportPdf}>
          <StickyNote size={13} /> Esporta PDF del viaggio
        </button>

        {!confirmingDelete ? (
          <button style={styles.resetBtn} onClick={startDeleteFlow}>
            <Trash2 size={13} /> Elimina tutto il viaggio
          </button>
        ) : (
          <div style={styles.deletePanel}>
            <div style={styles.deletePanelText}>
              Azione irreversibile. Il PDF di sicurezza è stato scaricato. Per confermare, scrivi <strong>ELIMINA</strong> qui sotto:
            </div>
            <input
              autoFocus
              value={deleteInput}
              onChange={(e) => setDeleteInput(e.target.value)}
              placeholder="ELIMINA"
              style={styles.deleteInput}
            />
            <div style={styles.formActions}>
              <button style={styles.deleteBtn} onClick={cancelDeleteFlow}>Annulla</button>
              <button
                style={{
                  ...styles.resetBtnConfirm,
                  opacity: deleteInput.trim().toUpperCase() === "ELIMINA" ? 1 : 0.4,
                  cursor: deleteInput.trim().toUpperCase() === "ELIMINA" ? "pointer" : "not-allowed",
                  width: "auto", marginTop: 0, padding: "8px 16px",
                }}
                onClick={confirmDelete}
                disabled={deleteInput.trim().toUpperCase() !== "ELIMINA"}
              >
                <Trash2 size={13} /> Elimina definitivamente
              </button>
            </div>
          </div>
        )}
      </div>

      <DetailModal
        item={items.find((it) => it.id === viewingId) || null}
        onClose={() => setViewingId(null)}
        onEdit={() => {
          setEditingId(viewingId);

        }}
      />
    </div>
  );
}

            <div style={styles.modalTitle}>{item.mode || "Spostamento"}</div>
            {(item.from || item.to) && (
              <div style={styles.modalSub}><Navigation size={13} style={{ opacity: 0.5 }} /> {item.from || "?"} → {item.to || "?"}</div>
            )}
            {item.notes && (
              <div style={{ ...styles.noteBlock, marginTop: 12, fontSize: 14, background: "#E8EEF0", borderLeftColor: "#5B7A8C", color: "#2F4550" }}>
                <StickyNote size={14} style={{ opacity: 0.6, flexShrink: 0, marginTop: 2 }} />
                <span style={{ whiteSpace: "pre-wrap" }}>{item.notes}</span>
              </div>
            )}
            {item.link && (
              <a href={item.link} target="_blank" rel="noreferrer" style={{ ...styles.linkRow, marginTop: 10 }}>
                <LinkIcon size={13} /> Apri link
              </a>
            )}
          </>
        )}

        <button style={styles.modalEditBtn} onClick={onEdit}>
          <Pencil size={14} /> Modifica
        </button>
      </div>
    </div>
  );
}

function MetaItem({ icon, label, value, mono }) {
  return (
    <div style={styles.metaItem}>
      <div style={styles.metaLabel}>{icon} {label}</div>
      <div style={{ ...styles.metaValue, fontFamily: mono ? "'JetBrains Mono', monospace" : undefined }}>{value}</div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={styles.fieldWrap}>
      <span style={styles.fieldLabel}>{label}</span>
      {children}
    </label>
  );
}
